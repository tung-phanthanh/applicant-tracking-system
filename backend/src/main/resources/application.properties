spring.application.name=ats
spring.profiles.active=local

server.port=${SERVER_PORT:8386}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Secret
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
jwt.secret-key=${JWT_SECRET_KEY:my-secret-key-123456}


# Email configurations
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Frontend URL used in email links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Sender name shown in emails
app.mail.from=${MAIL_FROM:no-reply@ats.com}